name: Integrar tareas programadas

# Las tareas programadas de Claude (claude.ai/code) solo pueden subir a ramas «claude/…».
# Este workflow integra en main esas ramas cuando todos sus commits vienen de una ejecución
# programada (trailer «IA-Actor: … (ejecución programada)») y pasan las reglas de ia/ de main.
# Si hay conflicto o una regla falla, se marca en rojo y no se integra nada. Ver docs/REVISION_SEMANAL.md.
on:
  push:
    branches: ["claude/**"]

permissions:
  contents: write

concurrency:
  group: integrar-main
  cancel-in-progress: false

jobs:
  integrar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          lfs: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Comprobar e integrar en main
        env:
          RAMA: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch -q origin main "$RAMA"
          n=$(git rev-list --count "origin/main..origin/$RAMA")
          if [ "$n" -eq 0 ]; then echo "Nada que integrar."; exit 0; fi
          for c in $(git rev-list --no-merges "origin/main..origin/$RAMA"); do
            if ! git log -1 --format=%B "$c" | grep -Eq 'IA-Actor:.*ejecuci.{1,2}n programada'; then
              echo "::error::$c no viene de una ejecución programada; no se integra."; exit 1
            fi
          done
          base=$(git merge-base origin/main "origin/$RAMA")
          mkdir -p "$RUNNER_TEMP/ia-main"
          for f in guard.py verificar.py check_skill.py politica.json; do
            git show "origin/main:ia/$f" > "$RUNNER_TEMP/ia-main/$f"
          done
          git checkout -q --detach "origin/$RAMA"
          python3 "$RUNNER_TEMP/ia-main/verificar.py" ci --root "$PWD" \
            --politica "$RUNNER_TEMP/ia-main/politica.json" --base "$base" --head HEAD
          git checkout -q -B main origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git merge -q --ff-only "origin/$RAMA"; then
            git merge -q --no-ff --no-edit -m "Integrar $RAMA en main" \
              -m "IA-Actor: GitHub Actions (integración de tarea programada)" "origin/$RAMA"
          fi
          git push origin HEAD:main
          echo "Integrada $RAMA ($n commits) en main: $(git rev-parse --short HEAD)"
