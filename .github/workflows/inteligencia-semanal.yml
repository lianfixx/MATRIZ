name: Inteligencia semanal (API)

# Cada domingo, antes de la revisión semanal de Claude (20:13, hora del centro de México). La lanza
# la propia revisión si todavía no existe la de hoy (docs/REVISION_SEMANAL.md, paso 1b). El reloj de
# GitHub (línea `cron`) queda solo como respaldo: medido el 23/11/2026, dispara con horas de retraso
# o no dispara. Si su corrida llega cuando ya no es domingo, o cuando la revisión de hoy ya existe,
# el trabajo «reloj» la termina sin llamar a la API.
# Qué hace: Sonnet 5.5 lee la bitácora pública de la semana y escribe la retroalimentación; Haiku 5.5
# propone el cerebro de los repositorios nuevos. Resultado: revisiones/AAAA-MM-DD-ia.md y .json,
# con su entrada en CHANGELOG.md. Solo propone: no toca matriz.config.json ni ningún otro
# repositorio. Paga con los créditos de API (secreto ANTHROPIC_API_KEY, espacio «matriz»), nunca
# con la suscripción. Si la API falla o no hay crédito, no escribe nada y la Matriz sigue igual.
# Los registros solo muestran conteos y costo. Ver docs/INTELIGENCIA.md.
on:
  schedule:
    - cron: "7 1 * * 1" # respaldo: domingo 19:07 CDMX = lunes 01:07 UTC (GitHub puede tardar horas o no dispararla)
  workflow_dispatch:
    inputs:
      seco:
        description: "No llamar a la API: solo mostrar qué enviaría y cuánto costaría"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: actualizar-matriz # el mismo grupo que la actualización: nunca escriben a la vez
  cancel-in-progress: false

jobs:
  reloj:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      seguir: ${{ steps.r.outputs.seguir }}
    steps:
      - id: r
        env:
          EVENTO: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          TZ: America/Mexico_City
        run: |
          seguir=true
          if [ "$EVENTO" = "schedule" ]; then
            if [ "$(date +%u)" != "7" ]; then
              seguir=false; echo "GitHub disparó la corrida programada cuando ya no es domingo ($(date '+%F %H:%M'), hora de México): no se hace nada." | tee -a "$GITHUB_STEP_SUMMARY"
            elif gh api "repos/$GITHUB_REPOSITORY/contents/revisiones/$(date +%F)-ia.md" --silent 2> /dev/null; then
              seguir=false; echo "La revisión de hoy ya existe: no se repite." | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "seguir=$seguir" >> "$GITHUB_OUTPUT"
  semanal:
    needs: reloj
    if: needs.reloj.outputs.seguir == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Pruebas
        run: python3 -m unittest discover -s tools -p 'test_*.py' 2> /dev/null > /dev/null
      - name: Retroalimentación y clasificación
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MATRIZ_RESERVADOS: ${{ secrets.MATRIZ_RESERVADOS }}
          TZ: America/Mexico_City
          SECO: ${{ inputs.seco && '--seco' || '' }}
        run: python3 tools/inteligencia.py semanal $SECO | tee -a "$GITHUB_STEP_SUMMARY"
      # Una vez por semana se comprueba de verdad que la segunda red sigue viendo: dos líneas ficticias,
      # una con datos inventados. Si no la marca, esta corrida queda en rojo.
      - name: Prueba real de la segunda red (líneas ficticias)
        if: ${{ !inputs.seco }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 tools/inteligencia.py red --prueba | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Guardar si hubo revisión
        if: always()
        run: |
          set -euo pipefail
          git add revisiones CHANGELOG.md
          if git diff --cached --quiet; then echo "Sin revisión que guardar."; exit 0; fi
          git -c user.name="matriz-bot" -c user.email="matriz-bot@users.noreply.github.com" \
            commit -m "Matriz: revisión semanal de la IA" -m "IA-Actor: GitHub Actions (tools/inteligencia.py)"
          for i in 1 2 3 4; do
            if git pull --rebase --quiet origin main && git push origin HEAD:main; then exit 0; fi
            echo "::warning::Intento $i de subir falló; se reintenta."; sleep $((i * 5))
          done
          exit 1
