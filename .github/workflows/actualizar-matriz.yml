name: Actualizar la Matriz

# Regenera el índice (MATRIZ.md, matriz.json, cerebros/, repos/, contexto/, bitacora/) leyendo
# cada repositorio. Corre cada día y a mano. No escribe en ningún otro repositorio.
# Para leer los privados necesita el secreto MATRIZ_TOKEN: un token de GitHub de grano fino,
# de solo lectura («Contents: Read-only») sobre los repositorios de lianfixx. Sin él, la Matriz
# se genera igual y marca los privados como «sin lectura».
on:
  schedule:
    - cron: "17 12 * * *" # 06:17, hora del centro de México
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["matriz.config.json", "tools/**"]

permissions:
  contents: write

concurrency:
  group: actualizar-matriz
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Pruebas del generador
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Generar
        env:
          MATRIZ_TOKEN: ${{ secrets.MATRIZ_TOKEN }}
          TZ: America/Mexico_City
        run: python3 tools/generar.py --clonar
      - name: Guardar si hubo cambios
        run: |
          set -euo pipefail
          git add MATRIZ.md matriz.json cerebros repos contexto bitacora
          if git diff --cached --quiet; then echo "Sin cambios."; exit 0; fi
          git -c user.name="matriz-bot" -c user.email="matriz-bot@users.noreply.github.com" \
            commit -m "Matriz: actualización automática" -m "IA-Actor: GitHub Actions (tools/generar.py)"
          git push
