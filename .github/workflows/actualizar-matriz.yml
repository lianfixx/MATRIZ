name: Actualizar la Matriz

# Regenera el índice (MATRIZ_GENERAL.md, MATRIZ.md, matriz.json, cerebros/, repos/, contexto/,
# bitacora/) leyendo cada repositorio. Corre en cuanto un repositorio de Emi cambia (aviso de GitHub),
# cada 15 minutos por si un aviso se pierde, a mano y después de cada edición desde el panel.
# Solo guarda (y el panel solo se publica) si algo cambió. No escribe en ningún otro repositorio.
# MATRIZ_RESERVADOS (opcional): nombres de clientes que nunca se publican, separados por coma.
# Para leer los privados necesita el secreto MATRIZ_TOKEN: un token de GitHub de grano fino,
# de solo lectura («Contents: Read-only») sobre los repositorios de lianfixx. Sin él, la Matriz
# se genera igual y marca los privados como «sin lectura».
on:
  schedule:
    - cron: "7,22,37,52 * * * *" # cada 15 minutos (GitHub puede retrasarlo unos minutos)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["matriz.config.json", "inventario.json", "EMI.md", "tools/**", "tablero/**", "proyectos/**"]
  # Lo que integra «Integrar tareas programadas» (la revisión semanal) no dispara «push»:
  # se regenera al terminar esa integración.
  workflow_run:
    workflows: ["Integrar tareas programadas"]
    types: [completed]
  # Aviso inmediato: cuando cualquier repositorio de Emi recibe un cambio, GitHub avisa al panel
  # (/gancho) y el panel dispara esta actualización (repository_dispatch).
  repository_dispatch:
    types: [repo-actualizado]

permissions:
  contents: write
  issues: write # solo para el aviso de la segunda red de privacidad

concurrency:
  group: actualizar-matriz
  cancel-in-progress: false

jobs:
  generar:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main # lo último de main, no el commit que disparó la corrida
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Pruebas del generador
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Generar
        env:
          MATRIZ_TOKEN: ${{ secrets.MATRIZ_TOKEN }}
          MATRIZ_RESERVADOS: ${{ secrets.MATRIZ_RESERVADOS }}
          TZ: America/Mexico_City
        run: python3 tools/generar.py --clonar
      # Segunda red de privacidad (docs/INTELIGENCIA.md): Haiku 5.5 revisa por la API las líneas nuevas
      # que están por publicarse. Solo avisa: nunca cambia ni detiene la publicación, y si la API falla
      # o no hay llave la Matriz se actualiza igual. El aviso no contiene el texto señalado.
      - name: Segunda red de privacidad (API, solo avisa)
        continue-on-error: true
        timeout-minutes: 4
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MATRIZ_RESERVADOS: ${{ secrets.MATRIZ_RESERVADOS }}
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 tools/inteligencia.py red --informe "$RUNNER_TEMP/red.json"
          [ -f "$RUNNER_TEMP/red.json" ] || exit 0
          n=$(python3 -c "import json,sys;print(len(json.load(open(sys.argv[1]))['hallazgos']))" "$RUNNER_TEMP/red.json")
          [ "$n" -gt 0 ] || exit 0
          titulo="Segunda red de privacidad: revisar posibles datos publicados"
          cuerpo=$(python3 - "$RUNNER_TEMP/red.json" <<'PY'
          import json, os, sys
          r = json.load(open(sys.argv[1]))
          print("La segunda red (Haiku 5.5) marcó", len(r["hallazgos"]), "línea(s) de la actualización", os.environ["RUN_URL"])
          print("\nNo se detuvo la publicación. Aquí no se copia el texto: solo dónde mirar.\n")
          for h in r["hallazgos"]:
              print(f"- `{h['archivo']}`, línea {h['linea']}: posible {h['categoria']} (confianza {h['confianza']})")
          print("\nQué hacer: si es un dato de cliente, agrega el nombre al secreto MATRIZ_RESERVADOS o corrige el CHANGELOG del repositorio de origen; la siguiente actualización lo tapa. Si es falsa alarma, cierra este aviso.")
          PY
          )
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$titulo in:title" --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body "$cuerpo"
          else gh issue create --repo "$GITHUB_REPOSITORY" --title "$titulo" --body "$cuerpo"; fi
      - name: Guardar si hubo cambios
        run: |
          set -euo pipefail
          git add MATRIZ_GENERAL.md MATRIZ.md matriz.json cerebros repos contexto bitacora
          if git diff --cached --quiet; then echo "Sin cambios."; exit 0; fi
          git -c user.name="matriz-bot" -c user.email="matriz-bot@users.noreply.github.com" \
            commit -m "Matriz: actualización automática" -m "IA-Actor: GitHub Actions (tools/generar.py)"
          # El panel o la integración semanal pueden escribir en main al mismo tiempo: reintentar.
          for i in 1 2 3 4; do
            if git pull --rebase --quiet origin main && git push origin HEAD:main; then exit 0; fi
            echo "::warning::Intento $i de subir falló; se reintenta."; sleep $((i * 5))
          done
          exit 1
