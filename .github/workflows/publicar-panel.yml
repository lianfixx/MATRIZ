name: Publicar panel

# Publica el panel (panel/index.html + matriz.json + contexto/) en Cloudflare Workers cada vez
# que la Matriz se actualiza. Necesita dos secretos del repositorio: CLOUDFLARE_API_TOKEN (plantilla
# «Edit Cloudflare Workers») y CLOUDFLARE_ACCOUNT_ID. Sin ellos, termina en verde sin publicar.
on:
  workflow_run:
    workflows: ["Actualizar la Matriz"]
    types: [completed]
  push:
    branches: [main]
    paths: ["panel/**", "tools/panel.py", "wrangler.jsonc"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicar-panel
  cancel-in-progress: true

jobs:
  publicar:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Armar el panel
        run: python3 tools/panel.py
      - name: Publicar en Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::notice::Faltan CLOUDFLARE_API_TOKEN o CLOUDFLARE_ACCOUNT_ID: el panel se armó pero no se publicó."
            exit 0
          fi
          npx --yes wrangler@4.154.0 deploy 2>&1 | tee salida.txt
          grep -Eo 'https://[a-zA-Z0-9.-]+\.workers\.dev' salida.txt | head -1 | sed 's/^/Panel: /' >> "$GITHUB_STEP_SUMMARY" || true
