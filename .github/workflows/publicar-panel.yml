name: Publicar panel

# Publica el panel (panel/ + matriz.json + contexto/ + MATRIZ_GENERAL.md) y el Worker (conector MCP
# y edición) en Cloudflare cada vez que la Matriz se actualiza.
# Secretos del repositorio:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID  publicar (sin ellos termina en verde sin publicar)
#   PANEL_CLAVE         contraseña de Emi para editar desde el panel
#   MATRIZ_ESCRITURA    token de GitHub solo para lianfixx/MATRIZ (Contents: lectura y escritura)
#   MATRIZ_RESERVADOS   nombres de clientes que el Worker no acepta (separados por coma)
# Los tres últimos se copian como secretos del Worker; si falta alguno, el panel se ve pero no edita.
on:
  workflow_run:
    workflows: ["Actualizar la Matriz"]
    types: [completed]
  push:
    branches: [main]
    paths: ["panel/**", "worker/**", "tools/panel.py", "tools/three/**", "wrangler.jsonc", "EMI.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicar-panel
  cancel-in-progress: true

jobs:
  publicar:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Armar el panel
        run: python3 tools/panel.py
      - name: Probar el conector MCP
        run: node worker/prueba.mjs
      - name: Publicar en Cloudflare
        shell: bash
        # Los secretos solo existen en este paso: armar y probar corren sin ellos.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PANEL_CLAVE: ${{ secrets.PANEL_CLAVE }}
          MATRIZ_ESCRITURA: ${{ secrets.MATRIZ_ESCRITURA }}
          MATRIZ_RESERVADOS: ${{ secrets.MATRIZ_RESERVADOS }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::notice::Faltan CLOUDFLARE_API_TOKEN o CLOUDFLARE_ACCOUNT_ID: el panel se armó pero no se publicó."
            exit 0
          fi
          npx --yes wrangler@4.154.0 deploy 2>&1 | tee salida.txt
          grep -Eo 'https://[a-zA-Z0-9.-]+\.workers\.dev' salida.txt | head -1 | sed 's/^/Panel: /' >> "$GITHUB_STEP_SUMMARY" || true
          # Secretos del Worker para editar: solo los que existen, en un archivo temporal que se borra.
          secretos="$(mktemp)"; trap 'rm -f "$secretos" salida.txt' EXIT
          python3 - "$secretos" <<'PY'
          import json, os, sys
          d = {k: os.environ[k] for k in ("PANEL_CLAVE", "MATRIZ_ESCRITURA", "MATRIZ_RESERVADOS") if os.environ.get(k)}
          json.dump(d, open(sys.argv[1], "w"))
          print("Secretos del Worker:", ", ".join(d) or "ninguno (el panel se ve pero no edita)")
          PY
          if [ "$(cat "$secretos")" != "{}" ]; then npx --yes wrangler@4.154.0 secret bulk "$secretos"; fi
